name: Publish public package
on:
  push:
    branches: [main]
    paths: ['Demo.Common.csproj', 'PriceCalculator.cs', '.github/workflows/publish-package.yml', 'scripts/publish_package.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-package-feed
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet run --project library-tests/Tests.csproj -c Release
      - run: python scripts/publish_package.py
